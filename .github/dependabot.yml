# Weekly, grouped dependency updates, deliberately conservative:
#   - container images: patch updates only (no new Python/Superset/Redis/nginx
#     minor or major lines, no release candidates); bigger moves are manual
#   - mcp / fastmcp / fastmcp-slim: no major updates (airflow-mcp-server 0.9.1
#     breaks on mcp 2.x; Superset 6.1 requires fastmcp < 4)
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
    groups:
      actions: {patterns: ["*"]}

  - package-ecosystem: pip
    directories: [/, /docker-mcp, /airflow-mcp]
    schedule: {interval: weekly}
    ignore:
      - dependency-name: mcp
        update-types: [version-update:semver-major]
      - dependency-name: "fastmcp*"
        update-types: [version-update:semver-major]
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories: [/docker, /docker-mcp, /airflow-mcp, /dbt-mcp]
    schedule: {interval: weekly}
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major, version-update:semver-minor]

  - package-ecosystem: docker-compose
    directory: /
    schedule: {interval: weekly}
    ignore:
      # Built locally from this repo (docker-compose `build:`), not on any registry
      - dependency-name: "weather-*"
      - dependency-name: "*"
        update-types: [version-update:semver-major, version-update:semver-minor]
