name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  compose-and-dbt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Exercises the same script users run (random secrets, uid/gid, dbt dirs)
      - name: Generate env files
        run: ./scripts/init_env.sh
      - run: docker compose config -q
      - name: dbt parse (no database needed)
        run: docker compose run --rm --no-deps dbt parse
