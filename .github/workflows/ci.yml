name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  compose-and-dbt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Exercises the same script users run (random secrets, uid/gid, dbt dirs)
      - name: Generate env files
        run: ./scripts/init_env.sh
      - run: docker compose config -q
      - name: dbt parse (no database needed)
        run: docker compose run --rm --no-deps dbt parse

  # Vulnerable dependencies, committed secrets and Dockerfile/compose misconfigurations.
  # Runs the pinned Trivy image directly instead of a third-party action.
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy (fails on fixable HIGH/CRITICAL findings)
        run: >
          docker run --rm -v "$PWD:/src:ro" aquasec/trivy:0.76.1 fs
          --scanners vuln,secret,misconfig --severity HIGH,CRITICAL --ignore-unfixed
          --exit-code 1 /src

  # End to end with the configuration a server/Coolify deploy uses: env block from
  # `make coolify-env` (root user, DBT_HOST_PATH auto-detected), fresh checkout.
  # Runs the whole DAG in mock mode (ingest -> dbt build -> source freshness),
  # starts the dbt MCP server, then takes a backup and runs the restore test.
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Env as for Coolify (make coolify-env + the server's docker gid)
        run: |
          ./scripts/init_env.sh --coolify > .env
          sed -i "s/^DOCKER_GID=.*/DOCKER_GID=$(stat -c %g /var/run/docker.sock)/" .env
      - name: Start Postgres, Airflow and the dbt MCP server
        run: |
          docker pull "$(grep '^DBT_IMAGE=' .env | cut -d= -f2)"
          docker compose up -d --build db af dbt_mcp
      - name: Wait for Airflow to load the DAG
        run: |
          for i in $(seq 1 60); do
            docker compose exec -T af airflow dags list 2>/dev/null | grep -q api-dbt-orchestrator && break
            sleep 10
          done
          docker compose exec -T af airflow dags list-import-errors
          docker compose logs af | grep "start.sh: DBT_HOST_PATH=$PWD/dbt"
      - name: Run the DAG
        run: |
          docker compose exec -T af airflow dags test api-dbt-orchestrator | tee dag-test.log
          grep -q "DagRun Finished:.*state=success" dag-test.log
      - name: Check the marts have data
        run: |
          rows=$(docker compose exec -T db psql -U postgres -d "$(grep '^DB_NAME=' .env | cut -d= -f2)" -tAc \
            "select count(*) from dev.weather_report")
          echo "weather_report rows: $rows"
          [ "$rows" -ge 1 ]
      - name: dbt MCP server is healthy
        run: |
          for i in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' "$(docker compose ps -q dbt_mcp)")" = healthy ] && exit 0
            sleep 5
          done
          exit 1
      - name: Backup and restore test
        run: |
          docker compose up -d db_backup
          for i in $(seq 1 30); do docker compose logs db_backup | grep -q "backup written" && break; sleep 2; done
          docker compose exec -T db_backup /opt/backup/verify.sh
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail=200 db af dbt_mcp db_backup
