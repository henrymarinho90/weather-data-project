# Reverse proxy in front of the four MCP servers (none of them validates Host or
# Origin). Blocks DNS-rebinding/CSRF from web pages: a browser on a malicious
# site sends Host: evil.example or Origin: https://evil.example.
worker_processes 1;
events { worker_connections 256; }

http {
    access_log off;
    # Docker's embedded DNS: resolve upstreams per request, so the gateway starts
    # even if an MCP container is down
    resolver 127.0.0.11 valid=10s ipv6=off;

    map $host $host_allowed {
        localhost 1;
        127.0.0.1 1;
        default   0;
    }
    # No Origin = non-browser client (Claude Code, curl): allowed
    map $http_origin $origin_allowed {
        ""                                           1;
        "~^https?://(localhost|127\.0\.0\.1)(:\d+)?$" 1;
        default                                      0;
    }

    # Streaming (Streamable HTTP and SSE): no buffering, long-lived connections
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;

    server {
        listen 5008;
        set $upstream superset_mcp:5008;
        include /etc/nginx/mcp_guard.conf;
    }
    server {
        listen 5009;
        set $upstream airflow_mcp:5009;
        include /etc/nginx/mcp_guard.conf;
    }
    server {
        listen 5010;
        set $upstream dbt_mcp:5010;
        include /etc/nginx/mcp_guard.conf;
    }
    server {
        listen 5011;
        set $upstream postgres_mcp:8000;
        include /etc/nginx/mcp_guard.conf;
    }
}
