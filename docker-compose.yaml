services:
  db:
    container_name: db
    image: postgres:18.6-bookworm
    ports:
      - 5000:5432
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
    - ./postgres/data:/var/lib/postgresql
    - ./postgres/airflow_init.sql:/docker-entrypoint-initdb.d/airflow_init.sql
    - ./postgres/superset_init.sql:/docker-entrypoint-initdb.d/superset_init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - my_network

  af:
    container_name: airflow_container
    image: apache/airflow:3.3.2
    ports:
      - 8081:8080
    env_file: .env
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@db:5432/airflow_db
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./api-request:/opt/airflow/api-request
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - "${DOCKER_GID:-1001}"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - my_network
    command: >
      bash -c "airflow db migrate && airflow standalone"
  dbt:
    container_name: dbt_container
    image: ghcr.io/dbt-labs/dbt-postgres:1.9.latest
    user: "1000:1000"
    environment:
      HOME: /tmp
      DBT_PROFILES_DIR: /usr/app
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
    volumes:
      - ./dbt:/usr/app
    working_dir: /usr/app/my_project
    depends_on:
      db:
        condition: service_healthy
    networks:
      - my_network
    # Connection check only; Airflow's DAG runs `dbt build` on schedule
    command: debug

  redis:
    container_name: superset_cache
    image: redis:7
    restart: unless-stopped
    volumes:
      - redis:/data
    networks:
      - my_network

  superset_init:
    container_name: superset_init
    # Superset 6.1 + psycopg2 + fastmcp, see docker/Dockerfile
    build: ./docker
    image: weather-superset:6.1.0
    command: ["/app/docker/docker-init.sh"]
    env_file: docker/.env
    environment:
      DATABASE_DB: superset_db
    volumes: &superset-volumes
      - ./docker/superset_config.py:/app/pythonpath/superset_config.py
      - ./docker/superset_config_docker.py:/app/pythonpath/superset_config_docker.py
      - ./docker/superset_setup.py:/app/docker/superset_setup.py
      - superset_home:/app/superset_home
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      disable: true
    networks:
      - my_network

  superset:
    container_name: superset_app
    build: ./docker
    image: weather-superset:6.1.0
    command: ["/app/docker/docker-bootstrap.sh", "app-gunicorn"]
    env_file: docker/.env
    environment:
      DATABASE_DB: superset_db
    restart: unless-stopped
    ports:
      - 8089:8088
    volumes: *superset-volumes
    depends_on:
      superset_init:
        condition: service_completed_successfully
      redis:
        condition: service_started
    networks:
      - my_network

  # MCP server for AI clients (Claude Code, Claude Desktop...): http://localhost:5008/mcp
  superset_mcp:
    container_name: superset_mcp
    build: ./docker
    image: weather-superset:6.1.0
    command: ["/app/docker/docker-bootstrap.sh", "mcp"]
    env_file: docker/.env
    environment:
      DATABASE_DB: superset_db
    restart: unless-stopped
    ports:
      # Localhost only: MCP auth is disabled for local development
      - 127.0.0.1:5008:5008
    healthcheck:
      # The image's default check probes the web app port (8088), not MCP
      test: ["CMD-SHELL", "curl -s -o /dev/null http://localhost:5008/mcp"]
      interval: 30s
      timeout: 10s
      retries: 3
    volumes: *superset-volumes
    depends_on:
      superset_init:
        condition: service_completed_successfully
    networks:
      - my_network

networks:
  my_network:
    name: weather_network
    driver: bridge

volumes:
  redis:
  superset_home:
