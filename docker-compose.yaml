# Weather ELT pipeline: Weatherstack -> Postgres -> dbt (via Airflow) -> Superset,
# plus MCP servers for AI clients behind mcp_gateway. Create .env and
# docker/.env first with `make init`. Every port is published on 127.0.0.1 only.

x-dbt-env: &dbt-env
  HOME: /tmp
  DBT_PROFILES_DIR: /usr/app
  DB_HOST: ${DB_HOST:-db}
  DB_PORT: ${DB_PORT:-5432}
  DB_NAME: ${DB_NAME:?run make init}

x-superset: &superset
  build: ./docker
  image: weather-superset:6.1.0
  env_file: docker/.env
  environment: &superset-env
    DATABASE_PASSWORD: ${SUPERSET_DB_PASSWORD:?run make init}
    # Connection Superset charts (and its MCP server) use for the weather data: read-only role
    WEATHER_DB_URI: postgresql://weather_reader:${DB_READER_PASSWORD}@db:5432/${DB_NAME}
  volumes: &superset-volumes
    - ./docker/superset_config.py:/app/pythonpath/superset_config.py:ro
    - ./docker/superset_config_docker.py:/app/pythonpath/superset_config_docker.py:ro
    - ./docker/superset_setup.py:/app/docker/superset_setup.py:ro
    - superset_home:/app/superset_home
  networks:
    - my_network

x-mcp-healthcheck: &mcp-healthcheck
  interval: 30s
  timeout: 10s
  retries: 3

services:
  db:
    container_name: db
    image: postgres:18.6-bookworm
    command:
      - postgres
      # pg_stat_statements powers the Postgres MCP server's slow-query tools;
      # track_utility=off keeps statements like ALTER ROLE ... PASSWORD out of it
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track_utility=off
    ports:
      - 127.0.0.1:${POSTGRES_HOST_PORT:-5434}:5432
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?run make init}
      POSTGRES_DB: ${DB_NAME:?run make init}
      # Read by postgres/init_roles.sh
      APP_DB_USER: ${DB_USER:?run make init}
      APP_DB_PASSWORD: ${DB_PASSWORD:?run make init}
      AIRFLOW_DB_PASSWORD: ${AIRFLOW_DB_PASSWORD:?run make init}
      SUPERSET_DB_PASSWORD: ${SUPERSET_DB_PASSWORD:?run make init}
      READER_DB_PASSWORD: ${DB_READER_PASSWORD:?run make init}
    volumes:
      - pg_data:/var/lib/postgresql
      - ./postgres/init_roles.sh:/docker-entrypoint-initdb.d/init_roles.sh:ro
    healthcheck:
      # -h localhost: stays unhealthy while the init scripts run on a fresh volume
      test: ["CMD-SHELL", "pg_isready -h localhost -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - my_network

  af:
    container_name: airflow_container
    image: apache/airflow:3.3.2
    ports:
      - 127.0.0.1:8081:8080
    # Only what the DAG and Airflow need (no env_file: keep other secrets out)
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD}@db:5432/airflow_db
      AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:?run make init}
      # 'mcp' is the account the airflow_mcp service logs in with (read-only by default)
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: "admin:admin,mcp:${AIRFLOW_MCP_ROLE:-viewer}"
      AIRFLOW_MCP_PASSWORD: ${AIRFLOW_MCP_PASSWORD:?run make init}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      WEATHERSTACK_API_KEY: ${WEATHERSTACK_API_KEY:-}
      WEATHER_CITY: ${WEATHER_CITY:-New York}
      USE_MOCK_API: ${USE_MOCK_API:-true}
      DBT_IMAGE: ${DBT_IMAGE:?run make init}
      DBT_HOST_PATH: ${DBT_HOST_PATH:?run make init}
      HOST_UID: ${HOST_UID:-1000}
      HOST_GID: ${HOST_GID:-1000}
    volumes:
      - ./airflow/dags:/opt/airflow/dags:ro
      - ./api-request:/opt/airflow/api-request:ro
      - ./airflow/seed_mcp_user.py:/opt/airflow/seed_mcp_user.py:ro
      # Lets the DockerOperator start dbt containers. Root-equivalent on the host:
      # anything that can change the DAG code controls the Docker daemon
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - "${DOCKER_GID:-0}"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - my_network
    command: >
      bash -c "airflow db migrate && python /opt/airflow/seed_mcp_user.py && airflow standalone"

  dbt:
    container_name: dbt_container
    image: ${DBT_IMAGE:?run make init}
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      <<: *dbt-env
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./dbt:/usr/app
    working_dir: /usr/app/weather
    depends_on:
      db:
        condition: service_healthy
    networks:
      - my_network
    # Connection check only; Airflow's DAG runs `dbt build` on schedule
    command: debug

  redis:
    container_name: superset_cache
    image: redis:7.4.12
    restart: unless-stopped
    volumes:
      - redis:/data
    networks:
      - my_network

  superset_init:
    <<: *superset
    container_name: superset_init
    command: ["/app/docker/docker-init.sh"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      disable: true

  superset:
    <<: *superset
    container_name: superset_app
    command: ["/app/docker/docker-bootstrap.sh", "app-gunicorn"]
    restart: unless-stopped
    ports:
      - 127.0.0.1:8089:8088
    depends_on:
      superset_init:
        condition: service_completed_successfully
      redis:
        condition: service_started

  # ---- MCP servers for AI clients. Not published directly: mcp_gateway exposes them.

  superset_mcp:
    <<: *superset
    container_name: superset_mcp
    command: ["/app/docker/docker-bootstrap.sh", "mcp"]
    restart: unless-stopped
    healthcheck:
      <<: *mcp-healthcheck
      # The image's default check probes the web app port (8088), not MCP
      test: ["CMD-SHELL", "curl -s -o /dev/null http://localhost:5008/mcp"]
    depends_on:
      superset_init:
        condition: service_completed_successfully

  airflow_mcp:
    container_name: airflow_mcp
    build: ./airflow-mcp
    image: weather-airflow-mcp:0.9.1
    environment:
      AIRFLOW_URL: http://af:8080
      AIRFLOW_MCP_USERNAME: mcp
      AIRFLOW_MCP_PASSWORD: ${AIRFLOW_MCP_PASSWORD}
      # --safe = read-only (GET) tools; --unsafe also needs AIRFLOW_MCP_ROLE=op or admin
      AIRFLOW_MCP_MODE: ${AIRFLOW_MCP_MODE:---safe}
    restart: unless-stopped
    healthcheck:
      <<: *mcp-healthcheck
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 5009), 3)"]
    depends_on:
      af:
        condition: service_started
        # Re-create together so the server logs in again
        restart: true
    networks:
      - my_network

  dbt_mcp:
    container_name: dbt_mcp
    # dbt-core-mcp on the same dbt image Airflow uses, see dbt-mcp/Dockerfile
    build:
      context: ./dbt-mcp
      args:
        DBT_IMAGE: ${DBT_IMAGE:?run make init}
    image: weather-dbt-mcp:1.7.1
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      <<: *dbt-env
      DBT_PROJECT_DIR: /usr/app/weather
      # Read-only role by default: query_database runs raw SQL
      DB_USER: ${DBT_MCP_DB_USER:-weather_reader}
      DB_PASSWORD: ${DBT_MCP_DB_PASSWORD:-${DB_READER_PASSWORD}}
      # safe = inspect, lineage, query and test; full = also build/run/seed models
      DBT_MCP_MODE: ${DBT_MCP_MODE:-safe}
    volumes:
      # Read-only: tools such as query_database(output_file=...) must not be able
      # to write models or macros that Airflow's dbt build would then execute
      - ./dbt:/usr/app:ro
      # dbt-core-mcp ignores DBT_PROFILES_DIR: it only reads profiles.yml from
      # the project dir or ~/.dbt (HOME=/tmp), so expose the shared one there
      - ./dbt/profiles.yml:/tmp/.dbt/profiles.yml:ro
    # Private target/ and logs/ (mount points created by make init): MCP-triggered
    # dbt commands never touch the artifacts of Airflow's scheduled dbt build
    tmpfs:
      - /usr/app/weather/target:uid=${HOST_UID:-1000},gid=${HOST_GID:-1000}
      - /usr/app/weather/logs:uid=${HOST_UID:-1000},gid=${HOST_GID:-1000}
    working_dir: /usr/app/weather
    restart: unless-stopped
    healthcheck:
      <<: *mcp-healthcheck
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 5010), 3)"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - my_network

  postgres_mcp:
    container_name: postgres_mcp
    image: crystaldba/postgres-mcp:0.3.0
    user: "1000:1000"
    environment:
      # Two layers: weather_reader is SELECT-only, and restricted mode rejects
      # non-read-only SQL before it is sent
      DATABASE_URI: postgresql://weather_reader:${DB_READER_PASSWORD}@db:5432/${DB_NAME}
    command: ["--access-mode=restricted", "--transport=sse", "--sse-host=0.0.0.0", "--sse-port=8000"]
    restart: unless-stopped
    healthcheck:
      <<: *mcp-healthcheck
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 8000), 3)"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - my_network

  # Docker API for docker_mcp, read-only: POST=0 rejects every request but GET/HEAD
  # (no create, start, stop, exec, delete). Reachable only on the private docker_api network
  docker_proxy:
    container_name: docker_proxy
    image: tecnativa/docker-socket-proxy:v0.5.0
    environment:
      CONTAINERS: 1
      IMAGES: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    networks:
      - docker_api

  docker_mcp:
    container_name: docker_mcp
    # Project-scoped, read-only Docker tools; see docker-mcp/server.py
    build: ./docker-mcp
    image: weather-docker-mcp:1.0.0
    environment:
      DOCKER_API: http://docker_proxy:2375
    restart: unless-stopped
    healthcheck:
      <<: *mcp-healthcheck
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 5012), 3)"]
    depends_on:
      - docker_proxy
    networks:
      - my_network
      - docker_api

  # Single entry point for the MCP servers. Rejects requests whose Host is not
  # localhost/127.0.0.1 or whose Origin is a foreign web page (DNS rebinding)
  mcp_gateway:
    container_name: mcp_gateway
    image: nginx:1.30.6-alpine
    volumes:
      - ./mcp-gateway/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./mcp-gateway/mcp_guard.conf:/etc/nginx/mcp_guard.conf:ro
    ports:
      - 127.0.0.1:5008:5008  # Superset MCP  /mcp
      - 127.0.0.1:5009:5009  # Airflow MCP   /mcp/
      - 127.0.0.1:5010:5010  # dbt MCP       /mcp
      - 127.0.0.1:5011:5011  # Postgres MCP  /sse
      - 127.0.0.1:5012:5012  # Docker MCP    /mcp
    restart: unless-stopped
    networks:
      - my_network

networks:
  my_network:
    name: weather_network
    driver: bridge
  # Only docker_mcp and docker_proxy: other containers cannot reach the Docker API
  docker_api:
    internal: true

volumes:
  pg_data:
  redis:
  superset_home:
