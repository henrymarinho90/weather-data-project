services:
  db:
    container_name: db
    image: postgres:18.6-bookworm
    ports:
      - 5000:5432
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      MCP_READER_PASSWORD: ${DBT_MCP_DB_PASSWORD:-}
    volumes:
    - ./postgres/data:/var/lib/postgresql
    - ./postgres/airflow_init.sql:/docker-entrypoint-initdb.d/airflow_init.sql
    - ./postgres/superset_init.sql:/docker-entrypoint-initdb.d/superset_init.sql
    - ./postgres/mcp_reader_init.sh:/docker-entrypoint-initdb.d/mcp_reader_init.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - my_network

  af:
    container_name: airflow_container
    image: apache/airflow:3.3.2
    ports:
      - 8081:8080
    env_file: .env
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@db:5432/airflow_db
      # 'mcp' is the account the airflow_mcp service logs in with (read-only by default)
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: "admin:admin,mcp:${AIRFLOW_MCP_ROLE:-viewer}"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./api-request:/opt/airflow/api-request
      - ./airflow/seed_mcp_user.py:/opt/airflow/seed_mcp_user.py:ro
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - "${DOCKER_GID:-1001}"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - my_network
    command: >
      bash -c "airflow db migrate && python /opt/airflow/seed_mcp_user.py && airflow standalone"

  # MCP server for AI clients to inspect Airflow: http://localhost:5009/mcp/
  airflow_mcp:
    container_name: airflow_mcp
    build: ./airflow-mcp
    image: weather-airflow-mcp:0.9.1
    environment:
      AIRFLOW_URL: http://af:8080
      AIRFLOW_MCP_USERNAME: mcp
      AIRFLOW_MCP_PASSWORD: ${AIRFLOW_MCP_PASSWORD}
      # --safe = read-only (GET) tools; --unsafe also needs AIRFLOW_MCP_ROLE=op or admin
      AIRFLOW_MCP_MODE: ${AIRFLOW_MCP_MODE:---safe}
    restart: unless-stopped
    ports:
      # Localhost only: anyone reaching this port acts as the Airflow mcp user
      - 127.0.0.1:5009:5009
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 5009), 3)"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      - af
    networks:
      - my_network
  dbt:
    container_name: dbt_container
    image: ghcr.io/dbt-labs/dbt-postgres:1.9.latest
    user: "1000:1000"
    environment:
      HOME: /tmp
      DBT_PROFILES_DIR: /usr/app
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
    volumes:
      - ./dbt:/usr/app
    working_dir: /usr/app/my_project
    depends_on:
      db:
        condition: service_healthy
    networks:
      - my_network
    # Connection check only; Airflow's DAG runs `dbt build` on schedule
    command: debug

  # MCP server for AI clients to inspect and test the dbt project: http://localhost:5010/mcp
  dbt_mcp:
    container_name: dbt_mcp
    # dbt-core-mcp on the same dbt image Airflow uses, see dbt-mcp/Dockerfile
    build: ./dbt-mcp
    image: weather-dbt-mcp:1.7.1
    user: "1000:1000"
    environment:
      HOME: /tmp
      DBT_PROFILES_DIR: /usr/app
      DBT_PROJECT_DIR: /usr/app/my_project
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}
      # Read-only role by default: query_database runs raw SQL. For
      # DBT_MCP_MODE=full set these to the DB_USER/DB_PASSWORD values
      DB_USER: ${DBT_MCP_DB_USER:-mcp_reader}
      DB_PASSWORD: ${DBT_MCP_DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      # safe = inspect, lineage, query and test; full = also build/run/seed models
      DBT_MCP_MODE: ${DBT_MCP_MODE:-safe}
    volumes:
      - ./dbt:/usr/app
      # dbt-core-mcp ignores DBT_PROFILES_DIR: it only reads profiles.yml from
      # the project dir or ~/.dbt (HOME=/tmp), so expose the shared one there
      - ./dbt/profiles.yml:/tmp/.dbt/profiles.yml:ro
    # Private target/ and logs/ so MCP-triggered dbt commands never collide
    # with the artifacts of Airflow's scheduled `dbt build`
    tmpfs:
      - /usr/app/my_project/target:uid=1000,gid=1000
      - /usr/app/my_project/logs:uid=1000,gid=1000
    working_dir: /usr/app/my_project
    restart: unless-stopped
    ports:
      # Localhost only: no client auth
      - 127.0.0.1:5010:5010
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 5010), 3)"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      db:
        condition: service_healthy
    networks:
      - my_network

  redis:
    container_name: superset_cache
    image: redis:7
    restart: unless-stopped
    volumes:
      - redis:/data
    networks:
      - my_network

  superset_init:
    container_name: superset_init
    # Superset 6.1 + psycopg2 + fastmcp, see docker/Dockerfile
    build: ./docker
    image: weather-superset:6.1.0
    command: ["/app/docker/docker-init.sh"]
    env_file: docker/.env
    environment:
      DATABASE_DB: superset_db
    volumes: &superset-volumes
      - ./docker/superset_config.py:/app/pythonpath/superset_config.py
      - ./docker/superset_config_docker.py:/app/pythonpath/superset_config_docker.py
      - ./docker/superset_setup.py:/app/docker/superset_setup.py
      - superset_home:/app/superset_home
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      disable: true
    networks:
      - my_network

  superset:
    container_name: superset_app
    build: ./docker
    image: weather-superset:6.1.0
    command: ["/app/docker/docker-bootstrap.sh", "app-gunicorn"]
    env_file: docker/.env
    environment:
      DATABASE_DB: superset_db
    restart: unless-stopped
    ports:
      - 8089:8088
    volumes: *superset-volumes
    depends_on:
      superset_init:
        condition: service_completed_successfully
      redis:
        condition: service_started
    networks:
      - my_network

  # MCP server for AI clients (Claude Code, Claude Desktop...): http://localhost:5008/mcp
  superset_mcp:
    container_name: superset_mcp
    build: ./docker
    image: weather-superset:6.1.0
    command: ["/app/docker/docker-bootstrap.sh", "mcp"]
    env_file: docker/.env
    environment:
      DATABASE_DB: superset_db
    restart: unless-stopped
    ports:
      # Localhost only: MCP auth is disabled for local development
      - 127.0.0.1:5008:5008
    healthcheck:
      # The image's default check probes the web app port (8088), not MCP
      test: ["CMD-SHELL", "curl -s -o /dev/null http://localhost:5008/mcp"]
      interval: 30s
      timeout: 10s
      retries: 3
    volumes: *superset-volumes
    depends_on:
      superset_init:
        condition: service_completed_successfully
    networks:
      - my_network

networks:
  my_network:
    name: weather_network
    driver: bridge

volumes:
  redis:
  superset_home:
